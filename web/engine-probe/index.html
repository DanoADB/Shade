<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shade — C++ WebGL2 Probe</title><style>body{margin:0;background:#101b20;color:#e1eee8;font:16px system-ui}header{padding:15px 22px;display:flex;justify-content:space-between}canvas{width:100%;height:calc(100vh - 120px);display:block}aside{padding:10px 22px;color:#b7ccc6;font-size:14px}a{color:#b3e1d4}</style></head><body><header><strong>SHADE / C++ graphics probe</strong><a href="/">Prototype</a></header><canvas id="canvas" width="1280" height="720"></canvas><aside><label>Load a locally exported openblack terrain mesh: <input id="meshfile" type="file" accept=".mesh,.txt"></label> <output id="meshstatus" role="status">Procedural island loaded</output><p>WebGL2 procedural island from C++ / WebAssembly. Arrows or WASD rotate and tilt; wheel zooms. This is not yet the openblack terrain renderer.</p></aside><script>var Module={canvas:document.getElementById('canvas'),printErr:function(x){console.error(x);document.getElementById('meshstatus').textContent='Runtime error: '+x}};</script><script src="/engine-probe/probe.js"></script><script>
document.getElementById('meshfile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const status=document.getElementById('meshstatus');
  try {
    const content=await file.arrayBuffer();
    if(content.byteLength>100000000)throw Error('Mesh too large (100MB limit)');
    const ptr=Module._malloc(content.byteLength);
    if(!ptr)throw Error('Out of WebAssembly memory');
    try {
      Module.HEAPU8.set(new Uint8Array(content),ptr);
      const triangles=Module._shade_load_mesh(ptr,content.byteLength);
      if(triangles<0)throw Error('Invalid mesh, code '+triangles);
      status.textContent='Loaded '+triangles.toLocaleString()+' triangles from local mesh';
    } finally {Module._free(ptr)}
  } catch(error) {status.textContent='Load failed: '+error.message;}
});
</script></body></html>
