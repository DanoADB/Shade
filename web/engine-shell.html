<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shade engine development</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#151b20;color:#edf2e7;font:14px system-ui}body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}button{min-height:44px;padding:8px 12px;background:#294335;border:1px solid #78917b;border-radius:9px;color:inherit;font:inherit;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #ecdc94}#status{font-size:12px;flex:1;min-width:160px}#stage{position:relative;flex:1;min-height:100px;overflow:hidden}canvas{display:block;width:100%!important;height:100%!important;touch-action:none}#touch-controls{position:absolute;inset:0;pointer-events:none;padding:12px 12px max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:16px}#touch-controls[hidden]{display:none}.pad,.lens{pointer-events:auto;display:grid;grid-template-columns:repeat(3,48px);gap:6px;touch-action:none;user-select:none}.pad button,.lens button{width:48px;height:48px;padding:0;font-size:24px;background:#15271fe6;box-shadow:0 2px 8px #0008}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3}.held{background:#698f52!important}.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#14221ddd;padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none}.lens{grid-template-columns:repeat(2,48px)}details{padding:4px 10px max(4px,env(safe-area-inset-bottom));font-size:12px}summary{cursor:pointer}textarea{display:block;width:100%;height:120px;background:#101419;color:#bde0bb;font-size:11px}@media(max-width:600px){header b{font-size:12px;width:100%}header{gap:5px;padding-top:max(6px,env(safe-area-inset-top))}header button{padding:5px 8px;font-size:12px;min-height:40px}#status{width:100%;flex-basis:100%;font-size:11px}.hint{font-size:11px;max-width:96%;text-align:center;white-space:normal}.pad,.lens{gap:4px}}@media(max-height:450px){header b{display:none}header{padding:4px 8px}header button{min-height:36px}#status{width:auto;flex-basis:auto}.hint{display:none}}
#gameplay{position:absolute;top:10px;right:10px;width:min(300px,calc(100% - 20px));max-height:75%;overflow:auto;background:#13231ff0;border:1px solid #879c74;border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:0 4px 20px #0008}#gameplay[hidden]{display:none}#gameplay strong{font-size:18px}#gameplay span{font-size:12px}#gameplay small{font-size:10px;color:#bec9b5}.find-actions,.task-actions{display:flex;flex-wrap:wrap;gap:5px}#gameplay button{font-size:12px;padding:5px 8px;flex:1}#wood-progress{color:#e4d493}#selection-marker{position:absolute;width:42px;height:42px;border:3px solid #ffe39a;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #203820;pointer-events:none}@media(max-height:450px){#gameplay{width:260px;padding:8px;gap:4px;max-height:68%}#gameplay strong{font-size:14px}#gameplay button{min-height:36px}}
.task-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.task-heading button{flex:none!important;font-size:11px!important}#task-body{display:grid;gap:8px}#task-body[hidden]{display:none}#gameplay{z-index:3}#touch-controls{z-index:2}#selection-marker{z-index:1}</style></head>
<body><header><b>Shade · original engine development</b> <button id="load">Load local game files</button><button id="village" disabled>Village view</button><button id="closeup" disabled>Village close-up</button><button id="villager" disabled>Villager view</button><button id="touch-toggle" aria-pressed="false">Touch controls</button><button id="fullscreen">Fullscreen</button><button id="restart" hidden>Reload engine</button><span id="status">Preparing game files…</span><input id="folder" type="file" webkitdirectory multiple hidden></header>
<main id="stage"><canvas id="canvas" tabindex="0" aria-label="Island. Drag to move, pinch to zoom, tap to point the god hand." oncontextmenu="event.preventDefault()"></canvas>
<div id="touch-controls" hidden><span class="hint">Drag to move · Pinch to zoom · Tap to point</span><div class="pad" role="group" aria-label="Move camera"><button class="up" data-control="2" aria-label="Move forward">↑</button><button class="left" data-control="0" aria-label="Move left">←</button><button class="down" data-control="3" aria-label="Move backward">↓</button><button class="right" data-control="1" aria-label="Move right">→</button></div><div class="lens" role="group" aria-label="View controls"><button data-control="8" aria-label="Zoom in">+</button><button data-control="9" aria-label="Zoom out">−</button><button data-control="4" aria-label="Rotate left">↶</button><button data-control="5" aria-label="Rotate right">↷</button><button data-control="6" aria-label="Tilt up">⌃</button><button data-control="7" aria-label="Tilt down">⌄</button></div></div></main><details><summary>Details</summary><textarea id="output" readonly aria-label="Engine log"></textarea></details>
<script>
const launchOptions = (() => {
 const query = new URLSearchParams(location.search);
 const levels = ['Land1.txt','Land2.txt','Land3.txt','Land4.txt','Land5.txt','LandT.txt','demo2.txt'];
 const requested = query.get('level');
 const level = levels.find(name => name.toLowerCase() === (requested || '').toLowerCase());
 return {level: level || 'Land1.txt', native: query.get('native') === '1' || !!level};
})();
var Module = {
 shadeNative: launchOptions.native,
 shadeDecodeTextures: new URLSearchParams(location.search).get('textures') === 'decoded',
 canvas: document.getElementById('canvas'),
 arguments: ['-g','/game','--start-level',launchOptions.level,'-l','stdout'],
 print: line => { const log=document.getElementById('output'); log.value+=line+'\n';log.scrollTop=log.scrollHeight; },
 printErr: line => Module.print(line),
 setStatus: text => { if(text) document.getElementById('status').textContent=text; if(text==='Running...'){for(const id of ['village','closeup','villager'])document.getElementById(id).disabled=Module.shadeNative;if(Module.mobileControls)Module.mobileControls.ready();} },
 onAbort: reason => Module.shadeStop ? Module.shadeStop('Engine stopped: '+reason) : Module.setStatus('Engine stopped: '+reason),
 onExit: code => Module.setStatus('Engine exited ('+code+'). See log below.'),
 preRun: [function() {
  Module.addRunDependency('original-assets');
  const button=document.getElementById('load'),folder=document.getElementById('folder');
  function safePath(path) {
   const parts=path.split('/');
   if(parts.some(p=>!p||p==='.'||p==='..'||p.includes('\\'))) throw Error('Invalid asset path');
   return '/game/'+parts.join('/');
  }
  async function install(entries) {
   button.disabled=true;
   try {
    Module.FS.mkdirTree('/game');
    let next=0,count=0,loaded=0;
    const total=entries.reduce((sum,entry)=>sum+(entry.bytes||0),0);
    const worker=async()=>{
     while(next<entries.length) {
      const entry=entries[next++],path=safePath(entry.path);
      const payload=new Uint8Array(await entry.read());
      if(entry.sha256) {
       const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',payload)),v=>v.toString(16).padStart(2,'0')).join('');
       if(digest!==entry.sha256 || payload.length!==entry.bytes) throw Error('Damaged game file: '+entry.path);
      }
      Module.FS.mkdirTree(path.slice(0,path.lastIndexOf('/')));
      Module.FS.writeFile(path,payload);
      loaded+=payload.length;count++;
      Module.setStatus('Loading game files '+count+' / '+entries.length+(total ? ' · '+Math.round(loaded/1048576)+' / '+Math.round(total/1048576)+' MB' : ''));
     }
    };
    const results=await Promise.allSettled(Array.from({length:4},worker));
    for(const result of results)if(result.status==='rejected')throw result.reason;
    for(const path of ['Scripts/Land1.txt','Scripts/info.dat','Data/AllMeshes.g3d','Data/AllAnims.anm'])
     if(!Module.FS.analyzePath('/game/'+path).exists) throw Error('Missing '+path+'; select the prepared Data/Scripts/Audio folder.');
    for(const path of ['Scripts/Playgrounds','Scripts/Quests','Scripts/CreatureMind']) Module.FS.mkdirTree('/game/'+path);
    Module.setStatus('Starting original engine…');
    Module.removeRunDependency('original-assets');
   } catch(error) { Module.printErr(String(error));Module.setStatus('Asset import failed: '+error.message);button.disabled=false;button.hidden=false; }
  }
  button.onclick=()=>folder.click();
  folder.onchange=()=>install(Array.from(folder.files,f=>({path:f.webkitRelativePath.split('/').slice(1).join('/'),read:()=>f.arrayBuffer()})));
  button.hidden=true;
  if(new URLSearchParams(location.search).has('local')) {
   fetch('/local-assets/manifest').then(r=>{if(!r.ok)throw Error('Local asset host unavailable');return r.json();})
    .then(manifest=>install(manifest.files.map(path=>({path,read:async()=>{const r=await fetch('/local-assets/file/'+path.split('/').map(encodeURIComponent).join('/'));if(!r.ok)throw Error('Missing '+path);return r.arrayBuffer();}}))))
    .catch(error=>{Module.setStatus(error.message);button.hidden=false;});
  } else {
   Module.setStatus('Downloading game files…');
   fetch('/game-assets/manifest.json',{cache:'no-store'}).then(r=>{
    if(!r.ok)throw Error('Hosted game files unavailable');return r.json();
   }).then(manifest=>{
    if(manifest.version!==1 || !Array.isArray(manifest.files) || !manifest.files.length)throw Error('Invalid game-file manifest');
    return install(manifest.files.map(entry=>{
     if(!/^\/game-assets\/objects\/[a-f0-9]{64}\.gz$/.test(entry.url) || !/^[a-f0-9]{64}$/.test(entry.sha256))throw Error('Invalid game-file entry');
     return {...entry,read:async()=>{const r=await fetch(entry.url);if(!r.ok)throw Error('Download failed: '+entry.path);return r.arrayBuffer();}};
    }));
   }).catch(error=>{Module.setStatus('Game files could not load: '+error.message);button.hidden=false;});
  }
 }]
};
window.addEventListener('error', event=>Module.setStatus('Engine error: '+event.message));
window.addEventListener('unhandledrejection', event=>Module.setStatus('Engine error: '+String(event.reason)));
document.getElementById('village').onclick=()=>{if(Module._shade_village_view)Module._shade_village_view(0);Module.canvas.focus();};
document.getElementById('closeup').onclick=()=>{if(Module._shade_village_view)Module._shade_village_view(1);Module.canvas.focus();};
document.getElementById('villager').onclick=()=>{if(Module._shade_villager_view)Module._shade_villager_view();Module.canvas.focus();};
if(Module.shadeNative)for(const id of ['village','closeup','villager'])document.getElementById(id).hidden=true;
Module.canvas.width=1280;Module.canvas.height=720;
</script>
<script src="mobile-controls.js"></script><script src="gameplay.js"></script>
{{{ SCRIPT }}}
</body></html>
